service: day13-l3a-monitoring-llmops-lab
primary_slo:
  name: fast_successful_requests
  window: 28d
  sli:
    good_event: 'event == "response_sent" and latency_ms <= 3000'
    total_event: 'event == "request_received"'
  target_percent: 99.5
  error_budget_percent: 0.5
  note: >-
    Baseline sạch đo được P95 = 797 ms (10 request, scripts/load_test.py
    --concurrency 5). Khi bật practice incident `rag_slow`, P95 tăng lên
    3130 ms — vượt ngưỡng 3000 ms — vì bước retrieval ngủ thêm 2,5 s, trong
    khi TTFT vẫn giữ ở 50 ms. Ngưỡng 3000 ms vì vậy nằm trên baseline (không
    báo động giả) nhưng dưới mức hỏng khi có sự cố (vẫn bắt được), và khớp
    guardrail latency_p95 <= 3000 trong config/dashboard.yaml.
    Error budget = 100% - 99,5% = 0,5%, tức trong cửa sổ 28 ngày được phép
    0,5% request vi phạm. Với 10.000 request/28 ngày thì budget là 50
    request; hết budget thì SLO bị đánh giá là đã cháy.
guardrails:
  error_rate_pct_max: 2
  daily_cost_usd_max: 2.5
  quality_score_avg_min: 0.75
  retrieval_success_rate_pct_min: 90
measurement:
  source: data/logs.jsonl
  method: >-
    P50/P95/P99 tính bằng app.metrics.percentile trên event response_sent;
    error_rate_pct = count(request_failed) / count(request_received) * 100;
    retrieval_success_pct = count(tool_success == true) / count(tool_success khác
    null) * 100. Cùng hàm được dùng lại trong app/observability.py và kiểm thử
    bằng tests/test_observability_stats.py.
  observed_baseline:
    latency_p95_ms: 797
    ttft_p95_ms: 50
    error_rate_pct: 0
    retrieval_success_pct: 100
    quality_mean: 0.88
    total_cost_usd: 0.0206
  observed_during_rag_slow:
    latency_p95_ms: 3130
    ttft_p95_ms: 51
    error_rate_pct: 0
    retrieval_success_pct: 100
    note: >-
      TTFT không đổi chứng minh độ trễ nằm ở bước retrieval, không phải ở
      LLM generation. Đây là tín hiệu dẫn tới span `retrieval` trong trace.
